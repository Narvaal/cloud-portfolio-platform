name: Deploy Frontend to CloudFront

on:
  push:
    branches:
      - production
    paths:
      - 'frontend/**'
  workflow_dispatch:

# OIDC: GitHub mints a short-lived token that AWS exchanges for role credentials
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load deploy config from SSM
        run: |
          get() {
            v=$(aws ssm get-parameters --names "$1" --query 'Parameters[0].Value' --output text)
            [ -n "$v" ] && [ "$v" != "None" ] || { echo "::error::missing SSM parameter $1"; exit 1; }
            echo "$v"
          }
          bucket=$(get /portfolio/config/s3-bucket)
          dist_id=$(get /portfolio/config/cloudfront-distribution-id)
          api_url=$(get /portfolio/config/api-base-url)
          {
            echo "S3_BUCKET=$bucket"
            echo "CLOUDFRONT_DISTRIBUTION_ID=$dist_id"
            echo "VITE_API_BASE_URL=$api_url"
          } >> "$GITHUB_ENV"

      # Build runs third-party code — keep AWS credentials out of its environment
      - name: Build
        working-directory: frontend
        run: env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN npm run build

      - name: Sync dist to S3
        run: |
          aws s3 sync frontend/dist/ s3://${S3_BUCKET}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp frontend/dist/index.html s3://${S3_BUCKET}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} \
            --paths "/*"

      - name: Write deploy info to SSM
        run: |
          REAL_SHA=$(git log --no-merges -1 --format="%H")
          REAL_MSG=$(git log --no-merges -1 --format="%s")
          REAL_DATE=$(git log --no-merges -1 --format="%cI")

          aws ssm put-parameter --name /portfolio/version \
            --value "$GITHUB_SHA" --type String --overwrite

          aws ssm put-parameter --name /portfolio/last-deploy \
            --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --type String --overwrite

          aws ssm put-parameter --name /portfolio/last-commit-sha \
            --value "${REAL_SHA::7}" --type String --overwrite

          aws ssm put-parameter --name /portfolio/last-commit-message \
            --value "${REAL_MSG}" --type String --overwrite

          aws ssm put-parameter --name /portfolio/last-commit-date \
            --value "${REAL_DATE}" --type String --overwrite
